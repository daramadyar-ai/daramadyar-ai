

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>درآمدیار AI</title>
<style>
body {
  margin: 0;
  font-family: Tahoma, sans-serif;
  background: #10172a;
  color: white;
  text-align: center;
}
header {
  background: #172544;
  padding: 20px;
  color: #f4c76b;
}
nav {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding: 15px;
}
button {
  background: #d7a943;
  color: #10172a;
  border: 0;
  padding: 12px 18px;
  border-radius: 9px;
  cursor: pointer;
  font-weight: bold;
}
button:hover { background: #f4c76b; }
section {
  display: none;
  padding: 20px;
  max-width: 650px;
  margin: auto;
}
section.active { display: block; }
.card {
  background: #1b2945;
  padding: 20px;
  border-radius: 14px;
  margin: 15px auto;
}
input, textarea, select {
  display: block;
  width: 90%;
  margin: 12px auto;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #52617d;
  box-sizing: border-box;
  font-family: inherit;
}
#logoPreview {
  background: #263653;
  padding: 30px;
  border-radius: 12px;
  margin: 15px;
}
</style>
</head>
<body>

<header>
  <h1>✦ درآمدیار AI ✦</h1>
  <p>مرکز طراحی لوگو و خدمات تبلیغاتی</p>
</header>

<nav>
  <button onclick="showPage('home')">خانه</button>
  <button onclick="showPage('logo')">طراحی لوگو</button>
  <button onclick="showPage('banner')">بنر تبلیغاتی</button>
  <button onclick="showPage('text')">متن تبلیغاتی</button>
  <button onclick="showPage('assistant')">دستیار هوشمند</button>
  <button onclick="showPage('order')">ثبت سفارش</button>
  <button onclick="showPage('admin')">مدیریت</button>
</nav>

<section id="home" class="active">
  <div class="card">
    <h2>به درآمدیار AI خوش آمدید</h2>
    <p>ایده‌های خود را به طرح‌های حرفه‌ای تبدیل کنید.</p>
    <button onclick="showPage('logo')">شروع طراحی</button>
  </div>
</section>

<section id="logo">
  <div class="card">
    <h2>طراحی لوگو</h2>
    <input id="logoName" placeholder="نام شرکت یا برند">
    <input id="logoColor" type="color" value="#d7a943">
    <input id="logoTag" placeholder="شعار شرکت">
    <button onclick="makeLogo()">ساخت لوگو</button>
    <div id="logoPreview">
      <h2 id="logoOutput">نام برند شما</h2>
      <p id="tagOutput">شعار برند</p>
    </div>
    <button onclick="downloadLogo()">دانلود لوگو</button>
  </div>
</section>

<section id="banner">
  <div class="card">
    <h2>ساخت بنر تبلیغاتی</h2>
    <input id="bannerTitle" placeholder="عنوان تبلیغ">
    <textarea id="bannerText" placeholder="متن تبلیغاتی"></textarea>
    <button onclick="makeBanner()">ساخت بنر</button>
    <div id="bannerOutput" class="card"></div>
  </div>
</section>

<section id="text">
  <div class="card">
    <h2>تولید متن تبلیغاتی</h2>
    <input id="product" placeholder="نام محصول یا خدمت">
    <button onclick="makeText()">تولید متن</button>
    <textarea id="textOutput" placeholder="متن پیشنهادی"></textarea>
    <button onclick="copyText()">کپی متن</button>
  </div>
</section>

<section id="assistant">
  <div class="card">
    <h2>دستیار درآمدیار</h2>
    <textarea id="question" placeholder="سؤال خود را بنویسید"></textarea>
    <button onclick="answerQuestion()">ارسال سؤال</button>
    <p id="answer"></p>
  </div>
</section>

<section id="order">
  <div class="card">
    <h2>ثبت سفارش</h2>
    <input id="customer" placeholder="نام مشتری">
    <input id="phone" placeholder="شماره تماس">
    <select id="service">
      <option>طراحی لوگو</option>
      <option>طراحی بنر</option>
      <option>متن تبلیغاتی</option>
    </select>
    <textarea id="description" placeholder="توضیحات سفارش"></textarea>
    <button onclick="submitOrder()">ثبت سفارش</button>
    <p id="orderMessage"></p>
  </div>
</section>

<section id="admin">
  <div class="card">
    <h2>پنل مدیریت</h2>
    <h3>سفارش‌های ثبت شده</h3>
    <div id="ordersList"></div>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);

function showPage(id) {
  document.querySelectorAll('section').forEach(s =>
    s.classList.remove('active')
  );
  $(id).classList.add('active');
  if (id === 'admin') showOrders();
}

function makeLogo() {
  const name = $('logoName').value.trim() || 'نام برند شما';
  const tag = $('logoTag').value.trim();
  $('logoOutput').textContent = '✦ ' + name;
  $('tagOutput').textContent = tag;
  $('logoOutput').style.color = $('logoColor').value;
}

function downloadLogo() {
  const name = $('logoOutput').textContent;
  const tag = $('tagOutput').textContent;
  const color = $('logoColor').value;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400">
  <rect width="100%" height="100%" fill="#263653"/>
  <text x="400" y="190" fill="${color}" font-size="55" text-anchor="middle">${escapeXML(name)}</text>
  <text x="400" y="260" fill="white" font-size="28" text-anchor="middle">${escapeXML(tag)}</text>
  </svg>`;
  const blob = new Blob([svg], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'logo.svg';
  a.click();
  URL.revokeObjectURL(url);
}

function escapeXML(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;',
    '"':'&quot;', "'":'&apos;'
  })[c]);
}

function makeBanner() {
  $('bannerOutput').innerHTML =
    '<h2>' + escapeXML($('bannerTitle').value) + '</h2><p>' +
    escapeXML($('bannerText').value) + '</p>';
}

function makeText() {
  const p = $('product').value.trim();
  if (!p) return alert('نام محصول را وارد کنید');
  $('textOutput').value =
    'با افتخار معرفی می‌کنیم: ' + p +
    '\nکیفیت عالی، خدمات حرفه‌ای و قیمت مناسب. همین امروز با ما تماس بگیرید!';
}

function copyText() {
  $('textOutput').select();
  document.execCommand('copy');
  alert('متن انتخاب شد؛ در صورت نیاز آن را کپی کنید.');
}

function answerQuestion() {
  const q = $('question').value.trim();
  $('answer').textContent = q
    ? 'برای موفقیت در کسب‌وکار، ابتدا مشتری هدف و نیاز او را مشخص کنید. سپس یک پیشنهاد جذاب و روشن ارائه دهید.'
    : 'لطفاً سؤال خود را بنویسید.';
}

let orders = [];
try {
  orders = JSON.parse(localStorage.getItem('incomeOrders') || '[]');
} catch(e) {
  orders = [];
}

function submitOrder() {
  const customer = $('customer').value.trim();
  const phone = $('phone').value.trim();
  if (!customer || !phone) {
    $('orderMessage').textContent = 'نام و شماره تماس را وارد کنید.';
    return;
  }

  orders.push({
    customer,
    phone,
    service: $('service').value,
    description: $('description').value
  });

  localStorage.setItem('incomeOrders', JSON.stringify(orders));
  $('orderMessage').textContent = 'سفارش در این دستگاه ثبت شد.';
  $('customer').value = '';
  $('phone').value = '';
  $('description').value = '';
}

function showOrders() {
  $('ordersList').replaceChildren();
  if (!orders.length) {
    $('ordersList').textContent = 'هنوز سفارشی ثبت نشده است.';
    return;
  }
  orders.forEach((o, i) => {
    const item = document.createElement('div');
    item.className = 'card';
    const title = document.createElement('b');
    title.textContent = o.customer + ' - ' + o.service;
    const detail = document.createElement('p');
    detail.textContent = o.phone + ' | ' + o.description;
    item.append(title, detail);
    $('ordersList').append(item);
  });
}
</script>
</body>
</html>
